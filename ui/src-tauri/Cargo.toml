[package]
name = "ui"
version = "0.2.0"
description = "YASGM management GUI"
authors = ["YASGM"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "2"


# Proc-macro dylibs are built with the build-override profile. Stripping them
# (release default: strip = "debuginfo") with Xcode 27's `strip` leaves a
# "mis-aligned LINKEDIT string pool" that dyld refuses to load, failing the
# build with "can't find crate for `<x>_macros`". Shipped binaries are still
# stripped as usual.
[profile.release.build-override]
strip = false
