# Publishes the Decky plugin: pushing a tag `v<version>` (matching
# decky/package.json) builds dist/yasgm-decky-<version>.zip + .sha256 and
# attaches them to that tag's GitHub Release (created if missing). Installed
# plugins find it through the GitHub releases API and update themselves via
# Decky Loader (D21). Desktop bundles join the same release in step 7.
name: Release Decky plugin

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.2.0"
        required: true

permissions:
  contents: write

jobs:
  decky:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Tag matches the plugin version
        run: |
          version="$(jq -r .version decky/package.json)"
          if [[ "v$version" != "$TAG" ]]; then
            echo "::error::tag $TAG doesn't match decky/package.json version $version"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: decky/package-lock.json
      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Build the plugin zip
        run: scripts/package-decky.sh

      - name: Attach to the release
        run: |
          version="${TAG#v}"
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --verify-tag --title "YASGM $TAG" --generate-notes
          gh release upload "$TAG" --clobber \
            "dist/yasgm-decky-$version.zip" "dist/yasgm-decky-$version.zip.sha256"
